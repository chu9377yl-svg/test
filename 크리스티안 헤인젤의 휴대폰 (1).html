const sfl=()=>`<div class="sh1"><span>최근검색어</span><span data-all="1">전체삭제</span></div>`+(SAFH.map((x,i)=>[x,i]).sort((a,b)=>(b[0][1]*1440+mm(b[0][2]))-(a[0][1]*1440+mm(a[0][2]))).map(([x,i])=>`<div class="sr" data-q="${esc(x[0]).replace(/"/g,'&quot;')}"><i>⌕</i><span>${esc(x[0])}</span><time>${nd(x[1])}</time><em data-x="${i}">✕</em></div>`).join('')||'<div class="sr" style="color:#999">최근 검색어가 없습니다.</div>');
function saf(){view='saf';$('#app').innerHTML=`<div class="nsf"><div class="nh"><span>☰</span><b>QR결제</b></div><div class="nlg">NAVER</div><div class="nw"><div class="nsb" id="nb"><input id="si" placeholder="검색어 또는 URL 입력" autocomplete="off"><span class="kb">⌨ ▴</span><span class="go" id="sg">⌕</span></div><div id="sh" hidden></div></div><div class="nhint"><span>« 쇼핑은<br>왼쪽에서</span><span style="text-align:right">뉴스는 »<br>오른쪽에서</span></div><a class="ad" href="${SAFURL}" target="_blank" rel="noopener"><div><small>오늘의 웹툰!</small><b>매일 새 화가 올라오는 네이버웹툰</b><span>지금 바로 보러가기</span></div><div class="at"><i>광고</i><span>웹툰 보기 ›</span></div></a><div class="wx2"><div><b>13°</b> 구름많음<br><small>어제보다 1° 높아요</small></div><div>미세 <em>보통</em></div><div>초미세 <em>보통</em></div></div><div class="nbt"><span>♡ 쇼핑수퍼</span><i></i><span>뉴스·콘텐츠</span></div></div>`;
const i=$('#si'),sh=$('#sh'),nb=$('#nb'),show=()=>{sh.hidden=false;nb.classList.add('f');sh.innerHTML=sfl()};
i.onfocus=show;i.onblur=()=>setTimeout(()=>{sh.hidden=true;nb.classList.remove('f')},150);
const go=()=>{const t=i.value.trim();if(!t)return;SAFH.unshift([t,0,h24()]);i.value='';show();toast('검색 결과는 아직 준비 중이에요')};
$('#sg').onmousedown=e=>{e.preventDefault();go()};i.onkeydown=e=>{if(e.key==='Enter')go()};
sh.onmousedown=e=>{e.preventDefault();const x=e.target.closest('[data-x]'),a=e.target.closest('[data-all]'),q=e.target.closest('[data-q]');if(a)SAFH.length=0;else if(x)SAFH.splice(+x.dataset.x,1);else if(q)i.value=q.dataset.q;sh.innerHTML=sfl()}}
/* 잠금화면 (암호 1220) */
const PASS='1220';let pin='',pad=0;
function lk(){const n=new Date(),L=$('#lk');L.className=pad?'pw':'';
L.innerHTML=`<div class="lw"></div>`+(pad?`<div class="pt1">위로 쓸어올려서 Face ID 사용 또는 암호 입력</div><div class="pd" id="pd">${[0,1,2,3].map(k=>`<i class="${k<pin.length?'f':''}"></i>`).join('')}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map((k,j)=>`<b data-k="${k}">${k}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][j]}</small></b>`).join('')}<span></span><b data-k="0">0</b></div><div class="pcn" id="pcn">취소</div>`:`<div class="ld">${n.getMonth()+1}월 ${n.getDate()}일 (${W[n.getDay()]})</div><div class="lt" id="lt">${n.getHours()%12||12}:${String(n.getMinutes()).padStart(2,'0')}</div><div class="lwg"><div class="w1">☁ <b>12°</b><br>부분적으로 흐림<br>최고:17° 최저:4°</div><div class="aq"><b>66</b><small>대기질</small></div><div class="aq"><b>🌧</b><small>토</small></div></div><div class="lb"><div>🔦</div><div>📷</div></div>`);
if(pad){L.onclick=null;L.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pk(b.dataset.k));$('#pcn').onclick=()=>{pad=0;pin='';lk()}}else L.onclick=()=>{pad=1;lk()}}
function pk(k){pin+=k;lk();if(pin.length<4)return;if(pin===PASS){$('#lk').classList.add('off');start()}else{$('#pd').classList.add('sk');setTimeout(()=>{pin='';lk()},350)}}
let started=0;
function start(){if(started)return;started=1;LIVE.forEach(([sec,x])=>tm.push(setTimeout(()=>recv(ian(),x),sec*1000)));CALLS_AT.forEach(sec=>setTimeout(ring,sec*1000));const bag=POOL.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);const loop=()=>{if(bag.length){recv(ian(),bag.pop());setTimeout(loop,40000+Math.random()*35000)}};setTimeout(loop,200000)}
home();lk();
</script></body></html>
